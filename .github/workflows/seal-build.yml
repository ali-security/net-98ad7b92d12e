# Upstream golang.org/x/net has no GitHub Actions CI (it is tested on the Go
# project's own LUCI builders), so this workflow is written from scratch. It
# packages the module zip exactly as the module proxy does and runs the
# project's own test suite (`go test ./...`) on Linux, macOS and Windows.
# Go 1.25 is used because the http2 tests are gated on
# `go1.25 || goexperiment.synctest` and would not compile in on Go 1.24.
name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: Space-separated top-level test names to run; empty runs the full suite
        required: false
        default: ''

permissions:
  contents: read

jobs:
  module-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: false

      # Build the packaging helper in its own module OUTSIDE the checkout, so
      # `go get` never touches this repository's go.mod/go.sum.
      - name: Build module-zip helper
        run: |
          set -eux
          HELPER=$(mktemp -d)
          cp "$GITHUB_WORKSPACE/.github/create_mod.go" "$HELPER/"
          cd "$HELPER"
          go mod init example.com/mod
          go get golang.org/x/mod@v0.24.0
          go build -o "$RUNNER_TEMP/create_mod" .

      # golang.org/x/mod/zip skips .git but DESCENDS into .github, so this
      # workflow would otherwise leak into the zip as extra entries that the
      # public proxy artifact does not have. .gitignore and .gitattributes are
      # kept: they ARE part of the published module zip.
      - name: Create module zip
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/out"
          rm -rf "$GITHUB_WORKSPACE/.github"
          "$RUNNER_TEMP/create_mod" \
            golang.org/x/net v0.45.0 \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/out/v0.45.0.zip"
          unzip -l "$RUNNER_TEMP/out/v0.45.0.zip" | tail -5

      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ runner.temp }}/out/v0.45.0.zip
          if-no-files-found: error

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        # Windows would otherwise default to pwsh, where `set -eux` fails.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'

      - name: Build
        run: |
          set -eux
          go version
          go build ./...

      # Full suite by default; with test-filter set, only the named top-level
      # tests run, and each one must log its own `=== RUN` line (go test exits
      # 0 when -run matches nothing).
      - name: Test
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          set -eu -o pipefail
          if [ -n "$TEST_FILTER" ]; then
            go test -v -run "^($(echo "$TEST_FILTER" | tr ' ' '|'))$" ./... 2>&1 | tee "$RUNNER_TEMP/scoped.log"
            for t in $TEST_FILTER; do
              grep -qE "^=== RUN[[:space:]]+${t}(/|$)" "$RUNNER_TEMP/scoped.log" || { echo "selected test ${t} did not run"; exit 1; }
            done
          else
            go test -v ./... 2>&1 | tee "$RUNNER_TEMP/full.log"
            awk '/^--- PASS/{p++} /^--- FAIL/{f++} /^--- SKIP/{s++} /^ok[[:space:]]/{k++} END{printf "TEST SUMMARY: %d passed, %d failed, %d skipped (top-level tests), %d packages ok\n", p, f, s, k}' "$RUNNER_TEMP/full.log"
          fi
